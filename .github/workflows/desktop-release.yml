# Viste SMS — validate the web app and build the Windows desktop app.
#
#   push / PR to main  -> typecheck, tests, web build, Windows installer (downloadable artifact)
#   push tag vX.Y.Z    -> same, then publish GitHub Release vX.Y.Z (installed apps auto-update)
#
# The web app itself is still deployed by Vercel's GitHub integration; this workflow
# never deploys the website. See DESKTOP.md for the release process.

name: Desktop build & release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    name: Validate & build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  desktop:
    name: Build Windows desktop
    needs: web
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      - name: Check tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match electron/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      - name: Build installer and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: viste-sms-windows-${{ github.sha }}
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/latest.yml
          if-no-files-found: error
          retention-days: 14
