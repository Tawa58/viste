# Always-on web service (does NOT sleep like free tier)
# https://render.com — choose Starter plan or higher so it stays up 24/7
services:
  - type: web
    name: viste-mgt
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_USE_MOCK_API
        value: "false"
      - key: NEXT_PUBLIC_SCHOOL_DATA_SOURCE
        value: firestore
      - key: NEXT_PUBLIC_APP_NAME
        value: Viste High School
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
