<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viste SMS</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #0b1b2b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1320;
          color: #e6edf5;
        }
        .card {
          background: #121c2b !important;
          border-color: #22324a !important;
        }
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 28px 24px;
        text-align: center;
        background: #fff;
        border: 1px solid #e3e8ef;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(11, 27, 43, 0.08);
      }
      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      h1 {
        font-size: 18px;
        margin: 14px 0 6px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 6px;
        opacity: 0.8;
      }
      .reason {
        font-size: 12px;
        opacity: 0.55;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #0b3d5c;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="icon.png" alt="" />
      <h1>Can't reach Viste SMS</h1>
      <p>Check your internet connection. Viste SMS will reconnect automatically when you're back online.</p>
      <p class="reason" id="reason"></p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
