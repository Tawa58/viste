[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Keep at least one instance running (always-on)
[deploy.numReplicas]
# Railway UI: set replicas to 1 and disable sleep / use a paid plan
