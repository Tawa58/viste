spring.application.name=viste-school-api
server.port=18080

spring.datasource.url=jdbc:h2:mem:viste;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

viste.jwt.secret=viste-high-school-dev-secret-change-me-in-production-32chars-min
viste.jwt.expiration-ms=86400000
viste.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174

logging.level.org.springframework.security=INFO
